# Builds the application and publishes the static output to the `gh-pages` branch, which
# GitHub Pages then serves. Only the built files live on that branch; its history is
# replaced on every deployment so the branch does not accumulate old bundles.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Puppeteer is a development dependency of the headless checks, which do not run
      # here; skipping its browser download saves a large part of the install.
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run build:pages

      - name: Publish to gh-pages
        working-directory: dist/psm/browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --initial-branch gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit --message "Build of ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
